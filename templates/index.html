<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Sistema Experto de Tinas
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    

</head>

<body>
    <div class="container py-5">
        <div class="card shadow-lg p-4">
            <h1 class="text-center">
                Sistema Experto de Tinas
            </h1>
            <form method="POST">
                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="tank">
                            <div id="water" class="water" style="height: {{ nivel }}%;">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">
                            Nivel de agua actual
                        </label>
                        <h2 class="text-center mt-3">
                            <span id="porcentaje">
                                {{ nivel }}
                            </span>%
                        </h2>
                        <input type="range" class="form-range" min="0" max="100" value="{{ nivel }}" name="nivel"
                            id="nivel">
                        <p>
                            Nivel anterior:
                            <strong>
                                {{ anterior }}
                                %
                            </strong>
                        </p>

                        <button class="btn btn-primary w-100">
                            Analizar Estado
                        </button>
                    </div>
                </div>

            </form>

            {% if estado %}

            <!---<div class="alert alert-success mt-5">--->
            <div class="alert alert-success mt-5">
                <h4>
                    Estado:
                    {{ estado }}
                </h4>
                <p>
                    {{ recomendacion }}
                </p>
            </div>

            {% endif %}
        </div>
    </div>

    <script>

        let range = document.getElementById("nivel");
        let water = document.getElementById("water");
        let porcentaje = document.getElementById("porcentaje");

        range.addEventListener("input", function () {
            water.style.height = this.value + "%";
            porcentaje.innerText = this.value;

        }
        );

    </script>

</body>

</html>
